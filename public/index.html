<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Listings – local preview</title>
  <!-- Mimics the Different Hats site: Montserrat on a black section. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap">
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: Montserrat, sans-serif; font-size: 16px; line-height: 28px; }
    main { max-width: 1140px; margin: 0 auto; padding: 60px 16px; }
    h2 { margin: 60px 0 24px; font-size: 20px; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <!-- Homepage: the original embed snippet -->
    <h2>Homepage (default)</h2>
    <div data-yt-listings></div>

    <h2>Shorts</h2>
    <div data-yt-listings data-yt-source="shorts"></div>

    <h2>List, alternating thumbnails, description</h2>
    <div data-yt-listings data-yt-layout="list" data-yt-thumb="alternate" data-yt-limit="4" data-yt-description="true" data-yt-links="true"></div>

    <h2>Grid of 30 with description</h2>
    <div data-yt-listings data-yt-limit="30" data-yt-description="true" data-yt-links="true"></div>

    <script src="/yt-listings.js" defer></script>
  </main>
</body>
</html>
